spring.application.name=ticket-reservation
server.port=8081

# 테스트는 개발용 DB(ticketdb)를 절대 건드리지 않도록 별도 스키마를 쓴다.
# createDatabaseIfNotExist=true 덕분에 별도로 DB를 만들 필요 없이 root 계정으로 첫 접속 시 자동 생성된다.
spring.datasource.url=jdbc:mysql://localhost:3306/ticketdb_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=20

# Redis는 개발과 동일 인스턴스를 쓰되, 테스트가 스스로 만든 키(event:{id}:*)만 만들고
# @AfterEach에서 전부 지우기 때문에 별도 DB 인덱스를 안 써도 안전하다.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT - 메인 설정과 동일한 데모 시크릿 (테스트 컨텍스트 부팅에 필요)
jwt.secret=dGlja2V0LXJlc2VydmF0aW9uLXBvcnRmb2xpby1kZW1vLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2Q=
jwt.access-token-validity-in-seconds=3600

logging.level.com.ticketreservation=debug
